name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: check out source
        uses: actions/checkout@v6

      - name: set up go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: check formatting
        run: make format-check

      - name: run go vet
        run: go vet ./...

      - name: run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout 5m
